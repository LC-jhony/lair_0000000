<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lair · Panel de control</title>
  <link rel="icon" href="/lair.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M7 4h5v19h13v5H7z"/></svg>
        <span>lair</span>
      </div>
      <nav id="nav">
        <button data-view="panel" class="active"><span class="ico">▤</span>Panel</button>
        <button data-view="runtimes"><span class="ico">◇</span>Versiones</button>
        <button data-view="databases"><span class="ico">▦</span>Bases de datos</button>
        <button data-view="sites"><span class="ico">◫</span>Sitios</button>
        <button data-view="services"><span class="ico">◈</span>Servicios</button>
        <button data-view="logs"><span class="ico">≡</span>Logs</button>
        <button data-view="system"><span class="ico">⚙</span>Sistema</button>
      </nav>
      <div class="side-foot">
        <div id="daemon-badge" class="badge">conectando…</div>
        <button id="theme" class="ghost" title="Cambiar tema">◐ Tema</button>
      </div>
    </aside>

    <main>
      <header class="topbar">
        <div>
          <h1 id="title">Panel</h1>
          <p id="subtitle">Estado de tu entorno de desarrollo</p>
        </div>
        <div class="top-actions">
          <button id="refresh" class="ghost">↻ Actualizar</button>
          <span id="home" class="muted"></span>
        </div>
      </header>

      <section id="content" class="content">
        <div class="loading">Cargando…</div>
      </section>
    </main>
  </div>

  <div id="toast" class="toast" hidden></div>

  <dialog id="prompt" class="prompt">
    <form method="dialog">
      <h3 id="prompt-title">Acción</h3>
      <p id="prompt-body" class="muted"></p>
      <label id="prompt-label" for="prompt-value">Valor</label>
      <input id="prompt-value" autocomplete="off" placeholder="">
      <menu>
        <button value="cancel" class="ghost">Cancelar</button>
        <button id="prompt-ok" value="ok" class="primary">Aceptar</button>
      </menu>
    </form>
  </dialog>

  <script src="/app.js"></script>
</body>
</html>
