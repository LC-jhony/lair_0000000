name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Comprueba el motor Go y la app nativa en cada cambio. No publica releases:
# la publicación sigue siendo manual con scripts/create-release.sh.
jobs:
  go:
    name: Go (test, vet, race, build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go test
        run: go test ./...

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: go test -race ./...

      - name: go build
        run: go build -o lair ./cmd/lair

  app:
    name: App nativa (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: npm ci
        run: npm ci

      - name: tests
        run: npm test

      - name: typecheck
        run: npm run typecheck

      - name: i18n:check
        run: npm run i18n:check

      - name: actions:check
        run: npm run actions:check

      - name: tui:typecheck
        run: npm run tui:typecheck

      - name: tui:build
        run: npm run tui:build

      - name: embedded TUI bundle is current
        run: git diff --exit-code -- ../internal/assets/tui.mjs ../internal/assets/tui.go

      - name: build
        run: npm run build
